name: Setup Node and install dependencies
description: Check out the repository, configure Node.js, and install npm dependencies.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'
  cache-dependency-path:
    description: Path to the npm lockfile used for cache invalidation.
    required: false
    default: package-lock.json
runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install dependencies
      shell: bash
      # Use --legacy-peer-deps to handle peer dependency conflicts in the XMRT ecosystem
      # (e.g., @wagmi/core, @web3modal/wagmi, viem version mismatches).
      # Prefer npm ci for reproducible installs, but fall back to npm install with the flag
      # if the lockfile is out of sync with package.json.
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        else
          npm install --legacy-peer-deps
        fi
