name: CodeQL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    # Dependabot pull_request runs cannot upload SARIF due read-only token permissions.
    # Keep scans on push/schedule/workflow_dispatch and non-Dependabot pull requests.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        # Required before invoking local composite actions (e.g. ./.github/actions/*)
        # so the runner has access to repository files.

      - name: Set up project
        uses: ./.github/actions/setup-node-install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: manual

      - name: Build application for analysis
        run: npm run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
